
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">

    <title>Jogo de Adivinhação de Números</title>

    <style>
        html {
            font-family: sans-serif;
        }

        body {
            width: 50%;
            max-width: 800px;
            min-width: 480px;
            margin: 0 auto;
        }

        .formulario input[type="number"] {
            width: 200px;
        }

        .ultimoResultado {
            color: white;
            padding: 3px;
        }
    </style>
</head>

<body>
    <h1>Jogo de Adivinhação de Números</h1>

    <p>
        Escolhemos um número aleatório entre 1 e 100.
        Veja se você consegue adivinhá-lo em 10
        tentativas ou menos. Nós lhe diremos se
        o seu palpite foi alto demais ou baixo demais.
    </p>

    <div class="formulario">
        <label for="campoPalpite">
            Digite seu palpite:
        </label>

        <input
            type="number"
            min="1"
            max="100"
            required
            id="campoPalpite"
            class="campoPalpite"
        >

        <input
            type="submit"
            value="Enviar palpite"
            class="enviarPalpite"
        >
    </div>

    <div class="paragrafosResultado">
        <p class="palpites"></p>
        <p class="ultimoResultado"></p>
        <p class="dica"></p>
    </div>

    <script src="./desafio06.js"></script>
</body>
</html>
